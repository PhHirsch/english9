<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Irregular Rush · The Hirsch Games</title>
<link rel="icon" href="logo.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#3a0e6a 0%,#0d0420 55%,#05020c 100%);color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  body:before{content:"";position:fixed;inset:auto 0 0 0;height:45vh;background:linear-gradient(transparent,#ff3bd422),repeating-linear-gradient(90deg,transparent 0 58px,#ff3bd455 58px 60px),repeating-linear-gradient(0deg,transparent 0 38px,#3ab0ff44 38px 40px);transform:perspective(300px) rotateX(55deg);transform-origin:bottom;pointer-events:none;z-index:-1}
  .wrap{max-width:760px;margin:0 auto;padding:14px}
  .back{color:#cbb6ff;text-decoration:none;font-size:15px}
  h1{font-family:"Arial Black",Impact,sans-serif;font-size:44px;margin:8px 0 2px;text-align:center;letter-spacing:.04em;color:#fff;text-shadow:0 0 8px #ff3bd4,0 0 24px #ff3bd4,0 0 40px #8a3bff}
  .sub{text-align:center;color:#d7c6ff;margin-bottom:14px}
  .de{color:#b9a8e0;font-size:14px}
  .panel{background:rgba(20,8,48,.75);border:1px solid #5a2a9a;border-radius:18px;padding:18px;box-shadow:0 0 30px #8a3bff33}
  .modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:12px 0}
  .mode{background:linear-gradient(135deg,#2a0f5a,#4a1a7a);border:2px solid #8a3bff;color:#fff;border-radius:14px;padding:14px;text-align:left;cursor:pointer;font-size:16px}
  .mode b{display:block;font-size:20px;margin-bottom:3px}
  .mode small{color:#d7c6ff}
  .mode:hover{border-color:#ff3bd4;box-shadow:0 0 16px #ff3bd4aa}
  .hud{display:flex;justify-content:space-between;align-items:center;font-family:Menlo,Consolas,monospace;font-size:20px;margin-bottom:10px}
  .hud .sc{color:#3affd4;text-shadow:0 0 8px #3affd4}
  .hud .cb{color:#ffd23a;text-shadow:0 0 8px #ffd23a}
  .timer{height:12px;border-radius:8px;background:#1a0838;overflow:hidden;border:1px solid #5a2a9a;margin-bottom:16px}
  .timer i{display:block;height:100%;background:linear-gradient(90deg,#ff3bd4,#ffd23a);transform-origin:left}
  .q{text-align:center;margin:8px 0 14px}
  .q .pr{font-size:28px;color:#3ab0ff;text-shadow:0 0 10px #3ab0ff}
  .q .vb{font-family:"Arial Black",Impact,sans-serif;font-size:46px;color:#fff;text-shadow:0 0 12px #ff3bd4}
  .q .mean{color:#b9a8e0;font-size:15px}
  input{width:100%;font-size:30px;text-align:center;padding:12px;border-radius:12px;border:2px solid #8a3bff;background:#0a0418;color:#fff;outline:none;font-family:inherit}
  input:focus{border-color:#ff3bd4;box-shadow:0 0 16px #ff3bd488}
  .acc{display:flex;gap:6px;justify-content:center;margin:10px 0}
  .acc button{font-size:20px;width:46px;height:42px;border-radius:10px;border:1px solid #8a3bff;background:#1a0838;color:#fff;cursor:pointer}
  .go{display:block;width:100%;margin-top:6px;font-size:22px;font-weight:800;padding:12px;border:0;border-radius:12px;background:linear-gradient(90deg,#ff3bd4,#8a3bff);color:#fff;cursor:pointer;letter-spacing:.05em}
  .fb{min-height:30px;text-align:center;font-size:19px;margin-top:10px;font-weight:700}
  .fb.ok{color:#3affd4}.fb.bad{color:#ff6a8a}.fb.warn{color:#ffd23a}
  .big{font-family:"Arial Black",Impact,sans-serif;font-size:54px;text-align:center;color:#3affd4;text-shadow:0 0 14px #3affd4}
  .me{width:64px;height:64px;border-radius:50%;overflow:hidden;background:#fff;border:3px solid #ff3bd4;margin:0 auto 8px;box-shadow:0 0 18px #ff3bd4}
  .me svg{width:100%;height:100%}
  .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
  .btn{font-size:17px;padding:10px 18px;border-radius:12px;border:1px solid #8a3bff;background:#2a0f5a;color:#fff;text-decoration:none;cursor:pointer}
  #coinbox{text-align:center;margin-top:12px;background:#1a0838;border-radius:12px;padding:10px}
  table{border-collapse:collapse;margin:8px auto;font-size:15px}
  td{padding:3px 10px;border-bottom:1px solid #3a1a6a}
  .shake{animation:sh .35s}
  @keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  .pop{animation:pp .3s}
  @keyframes pp{50%{transform:scale(1.08)}}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← Lobby</a>
  <h1>IRREGULAR RUSH</h1>
  <div class="sub">Type the verb forms as fast as you can! <span class="de">– Tippe die Verbformen so schnell du kannst!</span></div>
  <div id="app" class="panel"></div>
</div>
<script src="game.js?v=11"></script>
<script>
/* [infinitive, simple past, past participle, Deutsch] – Alternativen mit "/" */
const V = [
 ["be","was/were","been","sein"],["become","became","become","werden"],["begin","began","begun","anfangen"],["bite","bit","bitten","beißen"],
 ["break","broke","broken","brechen, kaputt machen"],["bring","brought","brought","bringen"],["build","built","built","bauen"],["buy","bought","bought","kaufen"],
 ["catch","caught","caught","fangen"],["choose","chose","chosen","wählen"],["come","came","come","kommen"],["cost","cost","cost","kosten"],
 ["cut","cut","cut","schneiden"],["do","did","done","tun, machen"],["draw","drew","drawn","zeichnen"],["drink","drank","drunk","trinken"],
 ["drive","drove","driven","fahren"],["eat","ate","eaten","essen"],["fall","fell","fallen","fallen"],["feed","fed","fed","füttern, ernähren"],
 ["feel","felt","felt","fühlen"],["fight","fought","fought","kämpfen"],["find","found","found","finden"],["fly","flew","flown","fliegen"],
 ["forget","forgot","forgotten","vergessen"],["get","got","got","bekommen"],["give","gave","given","geben"],["go","went","gone","gehen"],
 ["grow","grew","grown","wachsen"],["have","had","had","haben"],["hear","heard","heard","hören"],["hide","hid","hidden","verstecken"],
 ["hit","hit","hit","schlagen, treffen"],["hold","held","held","halten"],["hurt","hurt","hurt","verletzen"],["keep","kept","kept","behalten; bleiben"],
 ["know","knew","known","wissen, kennen"],["leave","left","left","verlassen"],["lend","lent","lent","verleihen"],["let","let","let","lassen"],
 ["lie","lay","lain","liegen"],["lose","lost","lost","verlieren"],["make","made","made","machen"],["mean","meant","meant","bedeuten"],
 ["meet","met","met","treffen"],["pay","paid","paid","bezahlen"],["put","put","put","legen, stellen"],["read","read","read","lesen"],
 ["ride","rode","ridden","reiten, fahren"],["ring","rang","rung","klingeln"],["run","ran","run","rennen"],["say","said","said","sagen"],
 ["see","saw","seen","sehen"],["sell","sold","sold","verkaufen"],["send","sent","sent","schicken"],["shoot","shot","shot","schießen"],
 ["show","showed","shown/showed","zeigen"],["sing","sang","sung","singen"],["sit","sat","sat","sitzen"],["sleep","slept","slept","schlafen"],
 ["speak","spoke","spoken","sprechen"],["spend","spent","spent","ausgeben; verbringen"],["stand","stood","stood","stehen"],["steal","stole","stolen","stehlen"],
 ["swim","swam","swum","schwimmen"],["take","took","taken","nehmen"],["teach","taught","taught","unterrichten"],["tell","told","told","erzählen"],
 ["think","thought","thought","denken"],["throw","threw","thrown","werfen"],["understand","understood","understood","verstehen"],["wake","woke","woken","wecken"],
 ["wear","wore","worn","tragen (Kleidung)"],["win","won","won","gewinnen"],["write","wrote","written","schreiben"]
];
const U2 = ["lie","wake","shoot","fly","feed","keep","grow","give","think","get","take","break","come","fight","hide","steal"];
const FORM = ["infinitive","simple past","past participle"];
const MODES = {
  past: { t: "Simple past", d: "go → went · see → saw …", v: V.map(x => x[0]), f: [1] },
  part: { t: "Past participle", d: "go → gone · see → seen …", v: V.map(x => x[0]), f: [2] },
  mix: { t: "Mixed – for pros!", d: "simple past or past participle", v: V.map(x => x[0]), f: [1, 2] },
  u2: { t: "Unit 2 verbs", d: "lie, wake, shoot, fly, feed …", v: U2, f: [1, 2] }
};
const KEY = "e9-irregular";
const $ = id => document.getElementById(id);
const verb = k => V.find(x => x[0] === k);
const clean = x => x.trim().toLowerCase().replace(/\s+/g, " ");
let G = null, S = null, tick = null;
function best(m) { try { return +localStorage.getItem(KEY + "-best-" + m) || 0; } catch (e) { return 0; } }
function setBest(m, v) { try { localStorage.setItem(KEY + "-best-" + m, v); } catch (e) {} }
const save = () => { try { sessionStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

function menu() {
  clearInterval(tick);
  $("app").innerHTML = `<div class="me">${E8.myAvatar()}</div>
    <p style="text-align:center;margin:0 0 4px">A verb appears. Type the form you see – before the time runs out! ⏱️</p>
    <p class="de" style="text-align:center;margin:0">Ein Verb erscheint. Tippe die gesuchte Form, bevor die Zeit abläuft. Du hast 3 Leben ❤️. Jede richtige Antwort in Folge erhöht den Combo-Bonus – und das Tempo!</p>
    <div class="modes">${Object.entries(MODES).map(([k, m]) => `<button class="mode" data-m="${k}"><b>${m.t}</b><small>${m.d}</small><br><span class="de">Record: ${best(k)}</span></button>`).join("")}</div>
    <details><summary class="de" style="cursor:pointer">📜 Look up the forms – Formen nachschauen</summary>
    <table><tr><td><b>infinitive</b></td><td><b>simple past</b></td><td><b>past participle</b></td><td></td></tr>
    ${V.map(x => `<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td class="de">${x[3]}</td></tr>`).join("")}</table></details>`;
  document.querySelectorAll(".mode").forEach(b => b.onclick = () => start(b.dataset.m));
}
function start(m) {
  G = { m: m, score: 0, lives: 3, combo: 0, n: 0, last: "" };
  S = { mistakes: 0, total: 0, start: Date.now(), wrongWords: [] };
  next();
}
const limit = () => Math.max(5, 14 - G.n * 0.35);
function next() {
  const M = MODES[G.m]; let v, f, k;
  do { v = M.v[Math.floor(Math.random() * M.v.length)]; f = M.f[Math.floor(Math.random() * M.f.length)]; k = v + f; } while (k === G.last);
  G.last = k; G.v = v; G.f = f; G.t0 = Date.now(); G.lim = limit(); G.lock = false;
  $("app").innerHTML = `<div class="hud"><span>${"❤️".repeat(G.lives)}${"🖤".repeat(3 - G.lives)}</span><span class="cb">${G.combo > 1 ? "COMBO ×" + Math.min(5, G.combo) : ""}</span><span class="sc">${G.score}</span></div>
    <div class="timer"><i id="bar"></i></div>
    <div class="q" id="q"><div class="pr">${FORM[f]}</div><div class="vb">${v}</div><div class="mean">${verb(v)[3]}</div></div>
    <input id="in" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="…">
    <button class="go" id="ok">OK ⏎</button><div class="fb" id="fb"></div>`;
  const inp = $("in"); inp.focus();
  inp.addEventListener("keydown", e => { if (e.key === "Enter") check(); });
  $("ok").onclick = check;
  clearInterval(tick);
  tick = setInterval(() => { const q = 1 - (Date.now() - G.t0) / 1000 / G.lim; $("bar").style.transform = `scaleX(${Math.max(0, q)})`; if (q <= 0) check(true); }, 50);
}
const sols = () => verb(G.v)[G.f].split("/");
function check(timeout) {
  if (G.lock) return;
  const val = clean($("in").value), ok = sols();
  if (!timeout && !val) return;
  G.lock = true; clearInterval(tick); S.total++; G.n++;
  const fb = $("fb");
  if (ok.indexOf(val) >= 0) {
    G.combo++;
    const mult = Math.min(5, G.combo), speed = Math.max(0, Math.round((1 - (Date.now() - G.t0) / 1000 / G.lim) * 10));
    const pts = (10 + speed) * mult;
    fb.className = "fb ok"; fb.textContent = `✓ Correct! +${pts}`;
    G.score += pts; $("q").classList.add("pop");
    setTimeout(next, 550);
  } else {
    G.combo = 0; G.lives--; S.mistakes++;
    if (S.wrongWords.length < 20) S.wrongWords.push(G.v + "|" + G.f);
    fb.className = "fb bad"; fb.innerHTML = `${timeout ? "⏱️ Time's up!" : "✗"} ${G.v} → <b>${ok.join(" / ")}</b>`;
    $("app").classList.add("shake"); setTimeout(() => $("app").classList.remove("shake"), 400);
    setTimeout(G.lives > 0 ? next : over, 1800);
  }
}
function over() {
  clearInterval(tick); S.end = Date.now(); save();
  const rec = G.score > best(G.m); if (rec) setBest(G.m, G.score);
  const ww = [...new Set(S.wrongWords.map(w => w.split("|")[0]))];
  $("app").innerHTML = `<div class="me">${E8.myAvatar()}</div><div style="text-align:center;font-size:22px">GAME OVER</div>
    <div class="big">${G.score}</div><div style="text-align:center">${rec ? "🏆 NEW RECORD! – Neuer Rekord!" : "Record: " + best(G.m)}</div>
    <div style="text-align:center" class="de">${S.total - S.mistakes} correct forms · ${MODES[G.m].t}</div>
    ${ww.length ? `<div style="text-align:center;margin-top:8px">Practise: ${ww.map(v => { const x = verb(v); return `<b>${x[0]} – ${x[1]} – ${x[2]}</b>`; }).join(" · ")}</div>` : ""}
    <div id="coinbox"></div>
    <div class="row"><button class="btn" id="again">🔁 Again</button><button class="btn" id="menu">🎮 Modes</button><a class="btn" href="index.html">🏠 Lobby</a></div>`;
  if (S.total >= 10) E8.reportInto("coinbox", "irregular", S, save);
  else $("coinbox").innerHTML = `Coins from 10 answers. <div class="de">Münzen gibt es ab 10 Antworten.</div>`;
  $("again").onclick = () => start(G.m); $("menu").onclick = menu;
}
menu();
window.RUSH = { G: () => G, sols: sols };
</script>
</body>
</html>
