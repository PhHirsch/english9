<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Lighthouse Logbook – Past progressive & simple past</title>
<link rel="icon" href="logo.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{--bg:#07131c;--panel:#102634;--deep:#0a1b26;--acc:#ffd84a;--onacc:#2a2100;--line:#2c4e63;--txt:#e8f4fa;--muted:#94b4c4;--ok:#5be3a0;--bad:#ff6b6b;--warn:#ffb347}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:18px;line-height:1.45;padding-bottom:40px;
    background-image:radial-gradient(ellipse at 50% 120%,#123a52,transparent 60%),linear-gradient(180deg,#050d14,#07131c 40%)}
  header{position:sticky;top:0;z-index:5;background:rgba(7,19,28,.93);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
  .hin{max-width:900px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
  .me{width:42px;height:42px;border-radius:50%;overflow:hidden;border:2px solid var(--acc);flex:none}
  .sea{flex:1;min-width:230px;max-width:380px}
  .seabar{position:relative;height:34px;border-radius:8px;background:linear-gradient(90deg,#1b4a66,#0f3247);overflow:hidden;border:1px solid var(--line)}
  .seabar .rock{position:absolute;left:4px;top:4px;font-size:20px}
  .seabar .boat{position:absolute;top:3px;font-size:22px;transition:left .8s}
  .seatxt{font-size:13px;color:var(--muted);margin-top:2px}
  .hbtn{background:transparent;color:var(--txt);border:1.5px solid var(--line);border-radius:10px;padding:7px 12px;font-size:15px;cursor:pointer;font-family:inherit}
  main{max-width:900px;margin:18px auto 0;padding:0 14px}
  .panel{background:linear-gradient(180deg,#14303f,var(--panel));border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
  .tag{display:inline-block;color:var(--acc);border:1px solid var(--acc);padding:2px 10px;border-radius:20px;font-size:13px;letter-spacing:.14em;text-transform:uppercase}
  h1{font-size:34px;margin:12px 0 6px;line-height:1.15} h2{font-size:25px;margin:10px 0 4px}
  .de{color:var(--muted);font-size:15px;font-style:italic;margin-top:3px}
  .say{display:flex;gap:12px;align-items:flex-start;background:var(--deep);border-left:4px solid var(--acc);padding:12px 14px;border-radius:8px;margin:14px 0}
  .say .ic{font-size:34px;line-height:1;flex:none}
  .radio{font-family:"SF Mono",Menlo,Consolas,monospace;background:#03100a;color:#7dffb0;border-radius:8px;padding:10px 14px;margin:12px 0;font-size:16px;border:1px solid #1d5a3a}
  .note{background:#f6efd8;color:#2b2416;border-radius:6px;padding:12px 16px;margin:12px 0;box-shadow:0 6px 16px rgba(0,0,0,.4);font-size:17px}
  .note b{color:#1a5f8a} .note .ex{font-style:italic}
  .tl{display:flex;flex-direction:column;gap:6px;margin:10px 0}
  .tl .bar{background:#1a5f8a;color:#fff;border-radius:6px;padding:3px 10px;font-size:15px}
  .tl .bar b{color:#ffd84a} .tl .flash b{color:#7a2a00}
  .tl .flash{align-self:center;background:#ffd84a;color:#2a2100;border-radius:6px;padding:3px 10px;font-size:15px;font-weight:700}
  .task{margin:16px 0 2px;font-weight:600}
  .feedback{min-height:28px;margin-top:12px;font-size:17px;font-weight:600} .feedback.bad{color:var(--bad)} .feedback.good{color:var(--ok)}
  .btn{font-size:20px;padding:12px 22px;border-radius:12px;border:2px solid var(--line);background:var(--deep);color:var(--txt);cursor:pointer;font-weight:600;font-family:inherit}
  .btn.primary{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .big{font-size:56px;text-align:center;margin:6px 0} .center{text-align:center}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
  .overlay.show{display:flex} .overlay .panel{max-width:680px;width:100%;max-height:88vh;overflow:auto}
  .rule{background:var(--deep);border-radius:10px;padding:12px 14px;margin:10px 0;border:1px solid var(--line)} .rule b{color:var(--acc)}
  input.name{font-size:22px;padding:12px 14px;border-radius:10px;border:2px solid var(--acc);width:100%;max-width:380px;background:var(--deep);color:var(--txt)}
  .small{font-size:14px;color:var(--muted)}
  a.back{color:inherit;opacity:.7;font-size:15px}
  .beam{animation:beam 3s linear infinite;transform-origin:50% 50%;display:inline-block}
  @keyframes beam{0%,100%{opacity:.4}50%{opacity:1}}
</style>
</head>
<body>
<header id="hdr" style="display:none"><div class="hin">
  <span class="me" id="me"></span>
  <div class="sea"><div class="seabar"><span class="rock">🪨</span><span class="boat" id="boat">🚤</span></div><div class="seatxt" id="seatxt"></div></div>
  <div class="row"><span class="small" id="msgno"></span><button class="hbtn" onclick="showRules()">📘 Rules</button></div>
</div></header>
<main id="app"></main>
<div class="overlay" id="ov" onclick="if(event.target===this)closeOv()"><div class="panel" id="ovc"></div></div>

<script src="game.js?v=11"></script>
<script src="tasks.js?v=2"></script>
<script>
const GAME_ID = "pp-lighthouse";
const MARTHA = "👵🏻";
const START_M = 1000, STEP_M = 30, MIN_M = 150;

const TL = `<div class="tl"><div class="bar">The crew <b>was fishing</b> …</div><div class="flash">⚡ A huge wave <b>hit</b> the boat.</div><div class="bar">The wind <b>was blowing</b> …</div></div>`;

const STATIONS = [
 { type:"sort", title:"Message 1: What happened?", icon:"📻",
   radio:"*krrrk* … Mayday … fishing boat SEA STAR … engine dead … we are drifting … *krrrk*",
   say:"The Sea Star is drifting towards Gull Rocks! The coastguard needs to know exactly what happened on board. The messages are full of noise – we must sort them. Look at my timeline first.",
   note:`${TL}<b>▬ bar = long action</b> – it was going on for some time → <b>past progressive</b> (was/were + -ing)<br>
     <b>⚡ flash = short action</b> – it happened suddenly → <b>simple past</b> (hit, stopped, broke …)`,
   noteDe:"Lange Handlungen (Balken) stehen im past progressive, kurze, plötzliche Handlungen (Blitz) im simple past.",
   task:"Is it a long action (bar) or a short action (flash)?", taskDe:"Ordne jeden Satz zu: lange Handlung (Balken) oder kurze Handlung (Blitz)?",
   cats:[["▬ Long action","was/were + -ing"],["⚡ Short action","simple past"]],
   cards:[
     ["The crew was fishing near the rocks.",0,"<b>was fishing</b> = was/were + -ing → long action. <span class='de'>Balken.</span>"],
     ["A huge wave hit the boat.",1,"<b>hit</b> = simple past → short action. <span class='de'>Blitz.</span>"],
     ["The wind was blowing hard.",0,"<b>was blowing</b> → long action. <span class='de'>Balken.</span>"],
     ["The engine stopped.",1,"<b>stopped</b> = simple past → short action. <span class='de'>Blitz.</span>"],
     ["The captain was steering the boat.",0,"<b>was steering</b> → long action. <span class='de'>Balken.</span>"],
     ["Water came into the engine room.",1,"<b>came</b> = simple past → short action. <span class='de'>Blitz.</span>"],
     ["Two men were pulling in the nets.",0,"<b>were pulling</b> → long action. <span class='de'>Balken.</span>"],
     ["The radio broke for a moment.",1,"<b>broke</b> = simple past → short action. <span class='de'>Blitz.</span>"]
   ],
   next:"Good – now the coastguard knows the basics. Here comes the next message!" },

 { type:"pick", title:"Message 2: The big wave", icon:"🌊",
   radio:"*krrrk* … we … fishing … when the storm … *krrrk* … the captain … the boat …",
   say:"Half of the words are missing. Complete the sentences – one long action, one short action.",
   note:`<span class="ex">The crew <b>was fishing</b> (▬) <b>when</b> the storm <b>started</b> (⚡).</span><br>
     <span class="ex"><b>While</b> the men <b>were pulling</b> in the nets (▬), the engine <b>stopped</b> (⚡).</span>`,
   noteDe:"Die lange Handlung wird von der kurzen unterbrochen.",
   task:"Choose the correct forms.", taskDe:"Lange Handlung: was/were + -ing · kurze Handlung: simple past.",
   hint:"Which action was going on (▬ was/were + -ing)? Which one happened suddenly (⚡ simple past)? <span class='de'>Was dauerte, was passierte plötzlich?</span>",
   items:[
     {t:"The crew {0} near Gull Rock when the storm {1}.", g:[["was fishing","fished"],["started","was starting"]], a:["was fishing","started"]},
     {t:"When the big wave {0}, the captain {1} the boat.", g:[["hit","was hitting"],["was steering","steered"]], a:["hit","was steering"]},
     {t:"The engine {0} while the men {1} in the nets.", g:[["stopped","was stopping"],["were pulling","pulled"]], a:["stopped","were pulling"]},
     {t:"While the cook {0} soup, the lights on board {1} out.", g:[["was making","made"],["went","were going"]], a:["was making","went"]},
     {t:"We {0} you when the radio suddenly {1}.", g:[["were calling","called"],["broke","was breaking"]], a:["were calling","broke"]}
   ],
   next:"The coastguard has sent the rescue boat! But they need more information …" },

 { type:"order", title:"Message 3: while & when", icon:"⚓",
   radio:"*krrrk* … steering … wave … *krrrk* … fishing … engine … *krrrk*",
   say:"These words came through, but in the wrong order. Build the sentences for the rescue team.",
   note:`<b>while</b> + long action (was/were + -ing) &nbsp;·&nbsp; <b>when</b> + short action (simple past)<br>
     <span class="ex"><b>While</b> the captain was steering<b>,</b> a wave hit the boat.</span> – <span class="ex">A wave hit the boat <b>while</b> the captain was steering.</span><br>
     Two long actions at the same time: <span class="ex">While the men were pulling in the nets, the wind was getting stronger.</span><br>
     <b>Comma</b> only when the while/when part comes first.`,
   noteDe:"Steht der while/when-Teil vorne, kommt ein Komma.",
   task:"Put the words in the right order.", taskDe:"Tippe die Wörter in der richtigen Reihenfolge an. Nochmal tippen = zurück.",
   hint:"<b>while</b> goes with the long action (was/were + -ing), <b>when</b> with the short action. Comma only if while/when comes first.",
   alt:{
     "While the captain was steering , a wave hit the boat .":["A wave hit the boat while the captain was steering ."],
     "We were fishing when the engine stopped .":[],
     "While the men were pulling in the nets , the wind was getting stronger .":["The wind was getting stronger while the men were pulling in the nets ."],
     "Martha was reading the logbook when the radio beeped .":[]
   },
   items:[
     ["While","the","captain","was","steering",",","a","wave","hit","the","boat","."],
     ["We","were","fishing","when","the","engine","stopped","."],
     ["While","the","men","were","pulling","in","the","nets",",","the","wind","was","getting","stronger","."],
     ["Martha","was","reading","the","logbook","when","the","radio","beeped","."]
   ],
   next:"The rescue boat is on its way. Now the captain is on the radio himself!" },

 { type:"type", title:"Message 4: The captain", icon:"🧑🏼‍✈️",
   radio:"Captain Reed here. Listen carefully … *krrrk*",
   say:"Write down exactly what the captain says. Use the verbs in brackets.",
   note:`▬ long action: <b>was/were + -ing</b> (sail → sailing, pull → pulling, wait → waiting)<br>
     ⚡ short action: <b>simple past</b> – careful with irregular verbs: fall → <b>fell</b>, hit → <b>hit</b>, see → <b>saw</b>`,
   noteDe:"Unregelmäßige Verben im simple past: fall – fell, hit – hit, see – saw.",
   task:"Write the correct forms.", taskDe:"Schreibe die richtigen Formen (past progressive oder simple past).",
   typeHint:(a,v)=>{ const n=T.norm(v), r=T.norm(a);
     if(!n) return "Please write something. – Bitte etwas eintragen.";
     if(/^(was|were) /.test(r)&&!/^(was|were) /.test(n)) return "This is a <b>long action</b> → was/were + -ing. <span class='de'>Lange Handlung.</span>";
     if(!/^(was|were) /.test(r)&&/^(was|were) /.test(n)) return "This is a <b>short action</b> → simple past. <span class='de'>Kurze Handlung: simple past.</span>";
     if(/^(was|were) /.test(r)&&n.split(" ")[0]!==r.split(" ")[0]) return "I/he/she/it → <b>was</b>, you/we/they → <b>were</b>.";
     return "Check the spelling (irregular verbs!). <span class='de'>Rechtschreibung / unregelmäßige Verben prüfen.</span>"; },
   items:[
     {t:"“We {0} back to the harbour when our engine {1}.”", v:["sail","stop"], a:["were sailing","stopped"]},
     {t:"“My son {0} in the nets when he {1} and hurt his arm.”", v:["pull","fall"], a:["was pulling","fell"]},
     {t:"“While I {0} you, a big wave {1} our radio.”", v:["call","hit"], a:["was calling","hit"]},
     {t:"“We {0} for help when we {1} your light.”", v:["wait","see"], a:["were waiting","saw"]},
     {t:"“At 9:30 the boat {0} towards the rocks.”", v:["drift"], a:["was drifting"]}
   ],
   next:"The rescue boat can see the Sea Star now! One last thing: Martha's report for the coastguard." },

 { type:"spot", title:"The logbook", icon:"📖", button:"Send the report",
   radio:"Coastguard: “Rescue boat is with the Sea Star. Please send your logbook report.”",
   say:"I wrote the report very fast with cold fingers. There are three mistakes in it. Can you find them?",
   task:"Tap the three wrong sentences. Then send the report.", taskDe:"Tippe die drei falschen Sätze an und schicke dann den Bericht.",
   hint:"Look for: long and short action mixed up, a wrong -ing form, a wrong form after <b>when</b>. <span class='de'>Prüfe die Formen genau.</span>",
   items:[
     {s:"The Sea Star was fishing near Gull Rock when the storm started.", wrong:false},
     {s:"While the captain steered, a big wave was hitting the boat.", wrong:true, fix:"While the captain was steering, a big wave hit the boat."},
     {s:"The engine stopped while the men were pulling in the nets.", wrong:false},
     {s:"The cook was makeing soup when the lights went out.", wrong:true, fix:"The cook was making soup when the lights went out."},
     {s:"The boat was drifting towards the rocks.", wrong:false},
     {s:"When the keeper saw the boat, she was call the coastguard.", wrong:true, fix:"When the keeper saw the boat, she called the coastguard."}
   ],
   next:"" }
];

/* ---------- STATE ---------- */
const KEY = "e9lighthouse";
const fresh = () => ({name:"",st:-1,pos:null,mistakes:0,dist:START_M,start:0,end:0,done:false,total:0});
let S = fresh();
const $ = id => document.getElementById(id);
function save(){ try{ sessionStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ const x=JSON.parse(sessionStorage.getItem(KEY)); if(x&&x.name) S=x; }catch(e){} }
function me(){ const s=window.E8&&E8.getSession(); return s?s.nr:null; }
function esc(s){ return String(s).replace(/[<>&"]/g,""); }
function fb(m,g){ const f=$("fb"); if(!f) return; f.className="feedback "+(g?"good":"bad"); f.innerHTML=m; }
function mistake(){ S.mistakes++; S.dist=Math.max(MIN_M,S.dist-STEP_M); save(); hud(); }
function resetGame(){ S=fresh(); try{ sessionStorage.removeItem(KEY); }catch(e){} render(); window.scrollTo(0,0); }

function hud(){
  $("hdr").style.display = S.st>=0 ? "block" : "none";
  if(!$("me").innerHTML) $("me").innerHTML = E8.myAvatar();
  const pct = 8 + (S.dist-MIN_M)/(START_M-MIN_M)*80;
  $("boat").style.left = pct+"%";
  $("seatxt").textContent = `Sea Star: ${S.dist} m from the rocks – Abstand zu den Felsen`;
  $("msgno").textContent = S.done?"":`Message ${Math.min(S.st+1,STATIONS.length)} / ${STATIONS.length}`;
}
function closeOv(){ $("ov").classList.remove("show"); }
function showRules(){
  $("ovc").innerHTML = `<span class="tag">Keeper's manual</span><h2>Past progressive & simple past</h2>
  ${TL}
  <div class="rule"><b>▬ Long action</b> (going on for some time): was / were + -ing<br><i>The crew was fishing. The wind was blowing.</i></div>
  <div class="rule"><b>⚡ Short action</b> (happened suddenly): simple past<br><i>A wave hit the boat. The engine stopped.</i></div>
  <div class="rule"><b>when</b> + short action: <i>We were fishing <u>when</u> the engine stopped.</i><br><b>while</b> + long action: <i><u>While</u> the captain was steering, a wave hit the boat.</i><br>Comma only when while/when comes first.</div>
  <div class="rule"><b>Irregular verbs:</b> hit – hit · fall – fell · see – saw · break – broke · come – came · go – went</div>
  <p class="de">Was lief gerade (Balken)? → past progressive. Was passierte plötzlich (Blitz)? → simple past.</p>
  <button class="btn primary" onclick="closeOv()">Got it!</button>`;
  $("ov").classList.add("show");
}

/* ---------- SCREENS ---------- */
function startScreen(){
  hud();
  $("app").innerHTML = `<div class="panel">
    <p style="margin:0 0 14px"><a class="back" href="./">← All exercises</a></p>
    <span class="tag">Gull Rock Lighthouse · stormy night</span>
    <h1><span class="beam">⛈️</span> Lighthouse Logbook</h1>
    <div class="row" style="align-items:flex-start;gap:18px">
      <div style="width:130px;border-radius:14px;overflow:hidden;flex:none;border:3px solid var(--acc)">${E8.myAvatar()}</div>
      <div style="flex:1;min-width:240px">
        <p>You are helping old Martha, the keeper of <b>Gull Rock Lighthouse</b>. Tonight there is a terrible storm.</p>
        <p>Suddenly the radio crackles: the fishing boat <b>Sea Star</b> has lost its engine and is <b>drifting towards the rocks</b>! The coastguard needs to know what happened on board – but the radio messages are broken.</p>
        <p>Every mistake costs time – and the Sea Star drifts <b>${STEP_M} m</b> closer to the rocks.</p>
      </div>
    </div>
    <p class="de">Rekonstruiere die Funksprüche. Du kommst nur weiter, wenn alles richtig ist. Jeder Fehler bringt das Boot näher an die Felsen.</p>
    <p class="task">Your name:</p>
    <div class="row"><input class="name" id="nm" maxlength="20" autocomplete="off" placeholder="your name" value="${me()?"No. "+me():""}">
      <button class="btn primary" onclick="begin()">Go to the radio</button></div>
    <div class="feedback" id="fb"></div>
  </div>`;
}
function begin(){
  const n=$("nm").value.trim();
  if(!n){ fb("Please enter your name. – Bitte gib deinen Namen ein."); return; }
  S=fresh(); S.name=n; S.nr=me(); S.st=0; S.start=Date.now();
  S.total=STATIONS.reduce((a,s)=>a+(s.cards?s.cards.length:T.count(s)),0);
  save(); render(); window.scrollTo(0,0);
}
function render(){
  hud();
  if(S.done) return finish();
  if(S.st<0) return startScreen();
  const st=STATIONS[S.st];
  $("app").innerHTML = `<div class="panel">
    <span class="tag">Message ${S.st+1} of ${STATIONS.length}</span>
    <h2>${st.icon} ${st.title}</h2>
    <div class="radio">📻 ${st.radio}</div>
    <div class="say"><div class="ic">${MARTHA}</div><div><b>Martha:</b> “${st.say}”</div></div>
    ${st.note?`<div class="note">${st.note}</div><div class="de">${st.noteDe||""}</div>`:""}
    <div class="task">${st.task}</div><div class="de">${st.taskDe}</div>
    <div id="ex"></div><div class="feedback" id="fb"></div></div>`;
  T.run($("ex"), st, {mistake, fb, done:solved, save:p=>{S.pos=p;save();}}, S.pos);
}
function solved(){
  const st=STATIONS[S.st];
  S.st++; S.pos=null;
  if(S.st>=STATIONS.length){ S.done=true; S.end=Date.now(); save(); render(); window.scrollTo(0,0); return; }
  save(); hud();
  $("app").innerHTML = `<div class="panel center"><div class="big">📡</div><h2>Message sent to the coastguard!</h2>
    <div class="say" style="text-align:left"><div class="ic">${MARTHA}</div><div><b>Martha:</b> “${st.next}”</div></div>
    <button class="btn primary" id="go">Next message →</button></div>`;
  $("go").onclick=()=>{ render(); window.scrollTo(0,0); };
}
function finish(){
  hud();
  const sec=Math.round((S.end-S.start)/1000), m=Math.floor(sec/60), s=sec%60;
  const rank=S.dist>=850?"Master Keeper 🏆":S.dist>=600?"Lighthouse Keeper 🥈":"Keeper's Assistant 🥉";
  $("app").innerHTML = `<div class="panel center">
    <div style="width:160px;margin:0 auto 8px;border-radius:50%;overflow:hidden;border:4px solid var(--acc);box-shadow:0 0 24px rgba(255,216,74,.4)">${E8.myAvatar()}</div>
    <div class="big">🛟🚤</div><span class="tag">Rescue complete</span>
    <h1>Everybody is safe, ${esc(S.name)}!</h1>
    <p>The rescue boat towed the Sea Star into the harbour. Captain Reed says on the radio: “While we were drifting in the dark, your light and your messages saved us. Thank you!”</p>
    <p style="font-size:22px">The Sea Star was <b style="color:var(--acc)">${S.dist} m</b> from the rocks when help arrived.</p>
    <p style="font-size:22px">Rank: <b>${rank}</b></p>
    <p>Mistakes: <b>${S.mistakes}</b> · Time: <b>${m} min ${s} s</b></p>
    <div id="coinbox" style="margin:14px auto;padding:12px;background:var(--deep);border:1px solid var(--acc);border-radius:12px;max-width:460px"></div>
    <p class="small">Show this screen to your teacher. – Zeig diesen Bildschirm deiner Lehrkraft.</p>
    <p class="row" style="justify-content:center"><button class="btn primary" onclick="resetGame()">New player / play again</button>
      <button class="btn" onclick="location.href='./'">← All exercises</button></p></div>`;
  if(window.E8) E8.reportInto("coinbox", GAME_ID, S, save);
}
function resumeScreen(){
  hud();
  $("app").innerHTML = `<div class="panel"><span class="tag">Lighthouse Logbook</span><h2>Welcome back!</h2>
    <p>Someone has already started this game on this iPad. – Auf diesem iPad hat schon jemand angefangen.</p>
    <div class="row"><button class="btn primary" onclick="render()">Continue as ${esc(S.name)}</button>
      <button class="btn" onclick="resetGame()">I'm a new player</button></div></div>`;
}

load();
if(S.name && me() && S.nr!==me()){ S=fresh(); save(); }
if(S.name && !S.done && S.st>=0) resumeScreen(); else render();
</script>
</body>
</html>
