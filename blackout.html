<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Blackout at Hollow Lane – Past progressive</title>
<link rel="icon" href="logo.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{--bg:#0d0a16;--panel:#1e1832;--deep:#130f22;--acc:#ffb347;--onacc:#241500;--line:#40366a;--txt:#f1ecff;--muted:#a99fc9;--ok:#58e39a;--bad:#ff6b7a;--warn:#ffd166}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:18px;line-height:1.45;padding-bottom:40px;
    background-image:radial-gradient(ellipse at 80% -10%,rgba(255,179,71,.14),transparent 50%),radial-gradient(ellipse at 10% 110%,#2a1f4a,transparent 60%)}
  header{position:sticky;top:0;z-index:5;background:rgba(13,10,22,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
  .hin{max-width:900px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
  .me{width:42px;height:42px;border-radius:50%;overflow:hidden;border:2px solid var(--acc);flex:none}
  .steps{display:flex;gap:6px}
  .steps span{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);color:var(--muted);font-size:14px}
  .steps span.done{background:var(--acc);border-color:var(--acc);color:var(--onacc)} .steps span.now{border-color:var(--acc);color:var(--acc)}
  .hbtn{background:transparent;color:var(--txt);border:1.5px solid var(--line);border-radius:10px;padding:7px 12px;font-size:15px;cursor:pointer;font-family:inherit}
  main{max-width:900px;margin:18px auto 0;padding:0 14px}
  .panel{background:linear-gradient(180deg,#241d3d,var(--panel));border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
  .tag{display:inline-block;color:var(--acc);border:1px solid var(--acc);padding:2px 10px;border-radius:20px;font-size:13px;letter-spacing:.14em;text-transform:uppercase}
  h1{font-size:34px;margin:12px 0 6px;line-height:1.15} h2{font-size:25px;margin:10px 0 4px}
  .de{color:var(--muted);font-size:15px;font-style:italic;margin-top:3px}
  .say{display:flex;gap:12px;align-items:flex-start;background:var(--deep);border-left:4px solid var(--acc);padding:12px 14px;border-radius:8px;margin:14px 0}
  .say .ic{font-size:34px;line-height:1;flex:none}
  .note{background:#fff8e6;color:#2a2418;border-radius:6px;padding:12px 16px;margin:12px 0;transform:rotate(-.4deg);box-shadow:0 6px 16px rgba(0,0,0,.4);font-size:17px;background-image:repeating-linear-gradient(#fff8e6 0 27px,#e6dcc4 27px 28px)}
  .note b{color:#b4441a} .note .ex{font-style:italic}
  .task{margin:16px 0 2px;font-weight:600}
  .feedback{min-height:28px;margin-top:12px;font-size:17px;font-weight:600} .feedback.bad{color:var(--bad)} .feedback.good{color:var(--ok)}
  .btn{font-size:20px;padding:12px 22px;border-radius:12px;border:2px solid var(--line);background:var(--deep);color:var(--txt);cursor:pointer;font-weight:600;font-family:inherit}
  .btn.primary{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .big{font-size:56px;text-align:center;margin:6px 0} .center{text-align:center}
  .street{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
  .house{background:var(--deep);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;font-size:14px}
  .house b{display:block;font-size:26px}
  .sus{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin:12px 0}
  .scard{background:var(--deep);border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;text-align:left;color:var(--txt);font-family:inherit;font-size:16px}
  .scard b{font-size:18px;display:block;margin-bottom:4px} .scard .em{font-size:34px}
  .scard.wrong{border-color:var(--bad);opacity:.55} .scard.right{border-color:var(--ok)}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
  .overlay.show{display:flex} .overlay .panel{max-width:680px;width:100%;max-height:88vh;overflow:auto}
  .rule{background:var(--deep);border-radius:10px;padding:12px 14px;margin:10px 0;border:1px solid var(--line)} .rule b{color:var(--acc)}
  .clue{background:var(--deep);border-left:4px solid var(--warn);border-radius:8px;padding:8px 12px;margin:8px 0;font-size:16px}
  input.name{font-size:22px;padding:12px 14px;border-radius:10px;border:2px solid var(--acc);width:100%;max-width:380px;background:var(--deep);color:var(--txt)}
  .small{font-size:14px;color:var(--muted)}
  a.back{color:inherit;opacity:.7;font-size:15px}
</style>
</head>
<body>
<header id="hdr" style="display:none"><div class="hin">
  <span class="me" id="me"></span>
  <div class="steps" id="steps"></div>
  <div class="row"><button class="hbtn" onclick="showNotes()">📓 Case notes</button><button class="hbtn" onclick="showRules()">📘 Rules</button></div>
</div></header>
<main id="app"></main>
<div class="overlay" id="ov" onclick="if(event.target===this)closeOv()"><div class="panel" id="ovc"></div></div>

<script src="game.js?v=13"></script>
<script src="tasks.js?v=2"></script>
<script>
const GAME_ID = "pp-blackout";
const RUBY = "👮🏾‍♀️";

/* ---------- STATIONS ---------- */
const STATIONS = [
 { type:"pick", title:"The street at 8:15", icon:"🏘️",
   say:"At 8:15 pm the lights went out in the whole street. Everybody was doing something at that moment. Look at my notes first!",
   note:`At 8:15 Mr Okafor <b>was watching</b> football on TV.<br>The Miller twins <b>were playing</b> a video game.<br>
     → <b>was / were + verb-ing</b> = <b>past progressive</b>: an action that was going on at a moment in the past.<br>
     I / he / she / it → <b>was</b> &nbsp;·&nbsp; you / we / they → <b>were</b>`,
   noteDe:"Das past progressive beschreibt, was zu einem Zeitpunkt in der Vergangenheit gerade im Gange war (lief gerade).",
   task:"Choose the correct form.", taskDe:"Wähle die richtige Form: was/were + -ing.",
   hint:"I / he / she / it → <b>was</b>, you / we / they → <b>were</b> – and the verb needs <b>-ing</b>. <span class='de'>was/were + -ing</span>",
   items:[
     {t:"At 8:15 Mrs Dalton {0} a bath.", g:[["was having","were having","was have"]], a:["was having"]},
     {t:"The Miller twins {0} a racing game.", g:[["were playing","was playing","were play"]], a:["were playing"]},
     {t:"Mr Okafor {0} football on TV.", g:[["was watching","were watching","watching"]], a:["was watching"]},
     {t:"Tom and Mrs Brown {0} at the door of No. 5.", g:[["were talking","was talking","were talk"]], a:["were talking"]},
     {t:"“I {0} dinner at the police station,” says Ruby.", g:[["was eating","were eating","was eat"]], a:["was eating"]},
     {t:"The street lamps {0} – and then everything went dark.", g:[["were shining","was shining","were shine"]], a:["were shining"]}
   ],
   clue:"8:15 pm: power cut in Hollow Lane. 8:25 pm: the lights came back – and Mrs Dalton's laptop was gone." },

 { type:"type", title:"The statements", icon:"📝",
   say:"I have talked to everybody. Please write down their statements – and be careful with the spelling of the -ing forms!",
   note:`make → mak<b>ing</b> (e weg) &nbsp;·&nbsp; s<b>it</b> → si<b>tt</b>ing, r<b>un</b> → ru<b>nn</b>ing, ch<b>at</b> → cha<b>tt</b>ing (short vowel + consonant → double)<br>
     l<b>ie</b> → l<b>y</b>ing &nbsp;·&nbsp; play → playing, walk → walking (just add -ing)`,
   noteDe:"Stummes -e fällt weg. Kurzer Vokal + ein Konsonant → Konsonant verdoppeln. -ie wird zu -y.",
   task:"Write was/were + the -ing form of the verb.", taskDe:"Schreibe was/were + -ing-Form.",
   typeHint:(a,v)=>{ const n=T.norm(v);
     if(!n) return "Please write something. – Bitte etwas eintragen.";
     if(!/^(was|were)\b/.test(n)) return "Don't forget <b>was</b> or <b>were</b>! <span class='de'>was/were fehlt.</span>";
     if(n.split(" ")[0]!==T.norm(a).split(" ")[0]) return "Check the subject: I/he/she/it → <b>was</b>, you/we/they → <b>were</b>.";
     if(!/ing$/.test(n)) return "The verb needs <b>-ing</b>. <span class='de'>-ing fehlt.</span>";
     return "Check the spelling of the -ing form (look at Ruby's note). <span class='de'>Schreibweise der -ing-Form prüfen.</span>"; },
   items:[
     {t:"Mr Okafor: “I {0} on my sofa.”", v:["sit"], a:["was sitting"]},
     {t:"Mrs Dalton: “I {0} in the bath.”", v:["lie"], a:["was lying"]},
     {t:"Jake: “Lily and I {0} a racing game.”", v:["play"], a:["were playing"]},
     {t:"Lily: “Our mum {0} on the phone.”", v:["chat"], a:["was chatting"]},
     {t:"Tom: “I {0} to No. 5 with a hot pizza.”", v:["run"], a:["was running"]},
     {t:"Mrs Brown: “I {0} Tom for the pizza.”", v:["pay"], a:["was paying"]},
     {t:"Ms Kowalski: “I {0} my dog in the park.”", v:["walk"], a:["was walking"]}
   ],
   clue:"Statements: Mr Okafor – on his sofa · the twins – racing game · Tom – pizza for No. 5 · Mrs Brown – paying Tom · Ms Kowalski – “in the park with my dog”." },

 { type:"order", title:"Questions for the suspects", icon:"❓",
   say:"Now we need good questions. A detective must ask clearly!",
   note:`Question: <b>Was / Were</b> + person + <b>-ing</b> …? &nbsp; <span class="ex">Were you watching TV?</span><br>
     With a question word: <span class="ex">What <b>were</b> you <b>doing</b> at 8:15?</span><br>
     Negative: <b>wasn't / weren't</b> + -ing &nbsp; <span class="ex">I <b>wasn't</b> sleeping.</span>`,
   noteDe:"Frage: was/were nach vorne. Verneinung: wasn't/weren't + -ing.",
   task:"Put the words in the right order.", taskDe:"Tippe die Wörter in der richtigen Reihenfolge an. Nochmal tippen = zurück.",
   hint:"Questions start with <b>was/were</b> (or a question word + was/were). <span class='de'>Fragen: was/were vor die Person.</span>",
   items:[
     ["What","were","you","doing","at","8:15","?"],
     ["Were","you","watching","TV",",","Mr","Okafor","?"],
     ["Was","Mrs","Dalton","sleeping","?"],
     ["We","weren't","playing","outside","."],
     ["Where","were","you","walking","your","dog","?"]
   ],
   clue:"The twins say: “We weren't playing outside – but we looked out of the window.”" },

 { type:"match", title:"Short answers", icon:"💬",
   say:"The suspects only give short answers. Which answer fits which question?",
   note:`Short answers repeat <b>was / were</b>: <span class="ex">Were you watching TV? – Yes, I <b>was</b>. / No, I <b>wasn't</b>.</span><br>
     <span class="ex">Was Tom standing there? – Yes, he <b>was</b>.</span>`,
   noteDe:"Kurzantworten: Yes/No + Person + was/were (wasn't/weren't). Achte auf die Person!",
   task:"Match each question with the right short answer.", taskDe:"Tippe links eine Frage an und dann rechts die passende Kurzantwort.",
   hint:"Look at the person in the question: you → I / we, Tom → he … <span class='de'>Achte auf die Person.</span>",
   pairs:[
     ["Mr Okafor, were you watching football?","Yes, I was."],
     ["Jake and Lily, were you playing outside?","No, we weren't."],
     ["Mrs Brown, was Tom standing at your door?","Yes, he was."],
     ["Tom, was Mrs Brown paying you?","Yes, she was."],
     ["Was it raining at 8:15?","No, it wasn't."],
     ["Were the street lamps working at 8:20?","No, they weren't."]
   ],
   clue:"Mrs Brown: “Yes, Tom was standing at my door the whole time.” → Tom has an alibi." },

 { type:"pick", title:"When the lights went out", icon:"💡",
   say:"Now it gets interesting! Some people noticed strange things during the blackout.",
   note:`<b>Long action</b> (was/were + -ing) + <b>short action</b> that interrupts it (simple past):<br>
     <span class="ex">Mrs Dalton <b>was having</b> a bath <b>when</b> the lights <b>went</b> out.</span><br>
     <span class="ex"><b>While</b> she <b>was lying</b> in the bath, somebody <b>took</b> her laptop.</span>`,
   noteDe:"Die längere Handlung steht im past progressive, die kurze Handlung, die dazwischenkommt, im simple past. Nach while steht meist die lange Handlung.",
   task:"Choose the correct forms.", taskDe:"Lange Handlung: was/were + -ing · kurze Handlung: simple past.",
   hint:"Long action → <b>was/were + -ing</b>. Short action → <b>simple past</b> (went, saw, took …). <span class='de'>Was dauerte länger, was passierte plötzlich?</span>",
   items:[
     {t:"Mr Okafor {0} football when the TV {1} off.", g:[["was watching","watched"],["went","was going"]], a:["was watching","went"]},
     {t:"When the lights {0} out, the twins {1} a game.", g:[["went","were going"],["were playing","played"]], a:["went","were playing"]},
     {t:"Tom {0} Mrs Brown her pizza when he {1} a dog.", g:[["was giving","gave"],["heard","was hearing"]], a:["was giving","heard"]},
     {t:"While Mrs Dalton {0} in the bath, somebody {1} her laptop.", g:[["was lying","lay"],["took","was taking"]], a:["was lying","took"]},
     {t:"The twins {0} for a torch when they {1} a woman with a big bag.", g:[["were looking","looked"],["saw","were seeing"]], a:["were looking","saw"]}
   ],
   clue:"Tom heard a dog. The twins saw a woman with a big bag. And Mr Okafor? The twins saw his candle in his window all the time." },

 { type:"spot", title:"The doorbell camera", icon:"📹", button:"Check my report",
   say:"Great news! The doorbell camera at No. 8 has a battery – it was recording during the blackout! I wrote a report, but I was in a hurry. There are three grammar mistakes in it.",
   note:`📹 <b>No. 8 – 8:16 pm:</b> a woman with a dog is walking towards No. 6.<br>📹 <b>8:19 pm:</b> she is carrying a big bag. The dog is barking.<br>📹 <b>8:22 pm:</b> she is walking away. There is mud on the dog's paws.`,
   noteDe:"Die Kamera an Haus Nr. 8 läuft mit Akku – sie hat trotz Stromausfall aufgenommen.",
   task:"Tap the three wrong sentences in Ruby's report. Then check.", taskDe:"Tippe die drei falschen Sätze an und drücke dann auf „Check my report“.",
   hint:"Look for: a missing <b>-ing</b>, <b>was</b> or <b>were</b> with the wrong person. <span class='de'>Prüfe -ing und was/were.</span>",
   items:[
     {s:"At 8:16 a woman was walk towards No. 6.", wrong:true, fix:"At 8:16 a woman was walking towards No. 6."},
     {s:"She was carrying a big bag.", wrong:false},
     {s:"Her dog were barking.", wrong:true, fix:"Her dog was barking."},
     {s:"Tom was standing at the door of No. 5.", wrong:false},
     {s:"The twins was looking for a torch.", wrong:true, fix:"The twins were looking for a torch."},
     {s:"Mrs Dalton was lying in the bath.", wrong:false}
   ],
   clue:"Camera No. 8: a woman with a dog and a big bag at No. 6 (8:16–8:22). The dog had mud on its paws – like the paw prints under Mrs Dalton's window!" },

 { type:"accuse", title:"Who is lying?", icon:"🔎",
   say:"Now you know everything. One person's statement is not true. Who is lying?",
   task:"Read the statements and look at your case notes. Tap the person who is lying.", taskDe:"Lies die Aussagen und deine Notizen (📓). Tippe auf die Person, die lügt.",
   suspects:[
     {n:"Mr Okafor", em:"👨🏿‍🦳", s:"“I was sitting on my sofa with a candle.”", no:"The twins saw his candle in his window all the time. His statement is true. <span class='de'>Seine Aussage stimmt.</span>"},
     {n:"Jake & Lily Miller", em:"👧🏼👦🏼", s:"“We were playing a racing game – then we were looking for a torch.”", no:"The twins saw the woman with the bag – they are witnesses, not thieves. <span class='de'>Sie sind Zeugen.</span>"},
     {n:"Tom (pizza delivery)", em:"🛵", s:"“I was giving Mrs Brown her pizza.”", no:"Mrs Brown said Tom was standing at her door the whole time. <span class='de'>Tom hat ein Alibi.</span>"},
     {n:"Ms Kowalski", em:"👩🏻‍🦰", s:"“I was walking my dog in the park. I wasn't in Hollow Lane.”", ok:true}
   ],
   clue:"Ms Kowalski said she was in the park – but the camera saw a woman with a dog at No. 6!" },

 { type:"type", title:"The confession", icon:"🗝️",
   say:"Ms Kowalski looks at the camera pictures. Then she says: “OK … I'll tell you the truth.” Write down her confession.",
   note:`Negative: <b>wasn't</b> + -ing &nbsp;·&nbsp; long action → <b>was + -ing</b> &nbsp;·&nbsp; short action → <b>simple past</b>`,
   noteDe:"Kurzformen (wasn't) und Langformen (was not) sind beide richtig.",
   task:"Write the correct forms of the verbs in brackets.", taskDe:"Schreibe die richtigen Formen (past progressive oder simple past).",
   typeHint:(a,v)=>{ const n=T.norm(v), r=T.norm(a);
     if(!n) return "Please write something. – Bitte etwas eintragen.";
     if(/^was/.test(r)&&!/^was/.test(n)) return "This is the <b>long action</b> → was + -ing. <span class='de'>Lange Handlung.</span>";
     if(!/^was/.test(r)&&/^was/.test(n)) return "This is the <b>short action</b> → simple past (saw, took …). <span class='de'>Kurze Handlung: simple past.</span>";
     return "Check the spelling. <span class='de'>Rechtschreibung prüfen.</span>"; },
   items:[
     {t:"“I {0} my dog in the park.”", v:["not walk"], a:["wasn't walking"]},
     {t:"“I {0} past No. 6 when I {1} the open window.”", v:["walk","see"], a:["was walking","saw"]},
     {t:"“While Mrs Dalton {0} a bath, I {1} the laptop.”", v:["have","take"], a:["was having","took"]},
     {t:"“My dog {0} when Tom {1} it.”", v:["bark","hear"], a:["was barking","heard"]}
   ],
   clue:"Case closed: the laptop was in Ms Kowalski's bag. Mrs Dalton got it back." }
];

/* ---------- STATE ---------- */
const KEY = "e9blackout";
const fresh = () => ({name:"",st:-1,pos:null,mistakes:0,start:0,end:0,done:false,total:0,intro:false});
let S = fresh();
const $ = id => document.getElementById(id);
function save(){ try{ sessionStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ const x=JSON.parse(sessionStorage.getItem(KEY)); if(x&&x.name) S=x; }catch(e){} }
function me(){ const s=window.E8&&E8.getSession(); return s?s.nr:null; }
function esc(s){ return String(s).replace(/[<>&"]/g,""); }
function fb(m,g){ const f=$("fb"); if(!f) return; f.className="feedback "+(g?"good":"bad"); f.innerHTML=m; }
function mistake(){ S.mistakes++; save(); }
function resetGame(){ S=fresh(); try{ sessionStorage.removeItem(KEY); }catch(e){} render(); window.scrollTo(0,0); }

function hud(){
  $("hdr").style.display = S.st>=0 ? "block" : "none";
  if(!$("me").innerHTML) $("me").innerHTML = E8.myAvatar();
  $("steps").innerHTML = STATIONS.map((_,i)=>`<span class="${i<S.st||S.done?"done":i===S.st?"now":""}">${i+1}</span>`).join("");
}
function closeOv(){ $("ov").classList.remove("show"); }
function showRules(){
  $("ovc").innerHTML = `<span class="tag">Detective handbook</span><h2>Past progressive</h2>
  <div class="rule"><b>Form:</b> was / were + verb-ing<br><i>At 8:15 Mr Okafor was watching TV. The twins were playing.</i><br>I / he / she / it → <b>was</b> · you / we / they → <b>were</b></div>
  <div class="rule"><b>Use:</b> an action that was going on at a moment in the past.<div class="de">Was lief gerade zu einem bestimmten Zeitpunkt?</div></div>
  <div class="rule"><b>-ing spelling:</b> make → making · sit → sitting · run → running · lie → lying</div>
  <div class="rule"><b>Negative:</b> wasn't / weren't + -ing · <b>Question:</b> Were you sleeping? What were you doing?<br><b>Short answers:</b> Yes, I was. / No, they weren't.</div>
  <div class="rule"><b>Long + short action:</b> She <u>was having</u> a bath <b>when</b> the lights <u>went</u> out.<br><b>While</b> she <u>was lying</u> in the bath, somebody <u>took</u> her laptop.<div class="de">Lange Handlung: past progressive · kurze Handlung, die dazwischenkommt: simple past</div></div>
  <button class="btn primary" onclick="closeOv()">Got it!</button>`;
  $("ov").classList.add("show");
}
function showNotes(){
  const c = STATIONS.slice(0, S.done?STATIONS.length:Math.max(0,S.st)).map(s=>`<div class="clue">${s.clue}</div>`).join("") || "<p>No clues yet. – Noch keine Hinweise.</p>";
  $("ovc").innerHTML = `<span class="tag">Case notes</span><h2>📓 What we know</h2>${c}<button class="btn primary" onclick="closeOv()">Close</button>`;
  $("ov").classList.add("show");
}

/* ---------- SCREENS ---------- */
function startScreen(){
  hud();
  $("app").innerHTML = `<div class="panel">
    <p style="margin:0 0 14px"><a class="back" href="./">← All exercises</a></p>
    <span class="tag">Case No. 9 · Saturday evening</span>
    <h1>🔦 Blackout at Hollow Lane</h1>
    <div class="row" style="align-items:flex-start;gap:18px">
      <div style="width:130px;border-radius:14px;overflow:hidden;flex:none;border:3px solid var(--acc)">${E8.myAvatar()}</div>
      <div style="flex:1;min-width:240px">
        <p>Last Saturday at <b>8:15 pm</b> the lights went out in Hollow Lane. Ten minutes later the lights came back – and Mrs Dalton's new <b>laptop</b> was gone! Her living room window was open.</p>
        <p>Detective Ruby Shaw needs a young detective. That's you! Find out what everybody <b>was doing</b> during the blackout – and who is lying.</p>
      </div>
    </div>
    <div class="street">${[["2","🏠","Mr Okafor"],["4","🏠","the Millers"],["5","🏠","Mrs Brown"],["6","🏚️","Mrs Dalton"],["7","🏠","Ms Kowalski"],["8","🏠","📹 camera"],["🛵","","Tom (pizza)"],["🌳","","the park"]].map(h=>`<div class="house"><b>${h[1]||h[0]}</b>${h[1]?"No. "+h[0]+"<br>":""}${h[2]}</div>`).join("")}</div>
    <p class="de">Löse den Fall. Du kommst nur weiter, wenn alles richtig ist. Falsch beantwortete Aufgaben kommen noch einmal.</p>
    <p class="task">Your detective name:</p>
    <div class="row"><input class="name" id="nm" maxlength="20" autocomplete="off" placeholder="your name" value="${me()?"No. "+me():""}">
      <button class="btn primary" onclick="begin()">Start the case</button></div>
    <div class="feedback" id="fb"></div>
  </div>`;
}
function begin(){
  const n=$("nm").value.trim();
  if(!n){ fb("Please enter your name. – Bitte gib deinen Namen ein."); return; }
  S=fresh(); S.name=n; S.nr=me(); S.st=0; S.start=Date.now();
  S.total=STATIONS.reduce((a,s)=>a+(s.type==="accuse"?1:T.count(s)),0);
  save(); render(); window.scrollTo(0,0);
}
function render(){
  hud();
  if(S.done) return finish();
  if(S.st<0) return startScreen();
  const st=STATIONS[S.st];
  $("app").innerHTML = `<div class="panel">
    <span class="tag">Step ${S.st+1} of ${STATIONS.length}</span>
    <h2>${st.icon} ${st.title}</h2>
    <div class="say"><div class="ic">${RUBY}</div><div><b>Ruby:</b> “${st.say}”</div></div>
    ${st.note?`<div class="note">${st.note}</div><div class="de">${st.noteDe||""}</div>`:""}
    <div class="task">${st.task}</div><div class="de">${st.taskDe}</div>
    <div id="ex"></div><div class="feedback" id="fb"></div></div>`;
  if(st.type==="accuse") return accuse(st);
  T.run($("ex"), st, {mistake, fb, done:solved, save:p=>{S.pos=p;save();}}, S.pos);
}
function accuse(st){
  $("ex").innerHTML = `<div class="sus">${st.suspects.map((x,i)=>`<button class="scard" data-i="${i}"><span class="em">${x.em}</span><b>${x.n}</b>${x.s}</button>`).join("")}</div>
    <button class="hbtn" onclick="showNotes()">📓 Read my case notes</button>`;
  document.querySelectorAll(".scard").forEach(b=>b.onclick=()=>{
    const x=st.suspects[+b.dataset.i];
    if(b.classList.contains("wrong")) return;
    if(x.ok){ b.classList.add("right"); fb("✔ Yes! The camera saw a woman with a dog at No. 6 – not in the park!",true); setTimeout(solved,1600); document.querySelectorAll(".scard").forEach(c=>c.onclick=null); }
    else { b.classList.add("wrong"); mistake(); fb("✘ "+x.no); }
  });
}
function solved(){
  const st=STATIONS[S.st];
  S.st++; S.pos=null;
  if(S.st>=STATIONS.length){ S.done=true; S.end=Date.now(); save(); render(); window.scrollTo(0,0); return; }
  save();
  $("app").innerHTML = `<div class="panel center"><div class="big">🧩</div><h2>New clue!</h2>
    <div class="clue" style="text-align:left">${st.clue}</div>
    <p class="de">Alle Hinweise findest du jederzeit unter 📓 Case notes.</p>
    <button class="btn primary" id="go">Next step →</button></div>`;
  hud();
  $("go").onclick=()=>{ render(); window.scrollTo(0,0); };
}
function finish(){
  hud();
  const sec=Math.round((S.end-S.start)/1000), m=Math.floor(sec/60), s=sec%60;
  const rank=S.mistakes<=3?"Chief Inspector 🏆":S.mistakes<=8?"Detective 🥈":"Junior Detective 🥉";
  $("app").innerHTML = `<div class="panel center">
    <div style="width:160px;margin:0 auto 8px;border-radius:50%;overflow:hidden;border:4px solid var(--acc);box-shadow:0 0 24px rgba(255,179,71,.4)">${E8.myAvatar()}</div>
    <span class="tag">Case closed</span>
    <h1>Well done, ${esc(S.name)}!</h1>
    <p>The laptop was in Ms Kowalski's bag. She had seen the open window while she was walking past No. 6. Mrs Dalton got her laptop back – and Ruby says: “While you were working on this case, I was learning a lot from you!”</p>
    <p style="font-size:22px">Rank: <b>${rank}</b></p>
    <p>Mistakes: <b>${S.mistakes}</b> · Time: <b>${m} min ${s} s</b></p>
    <div id="coinbox" style="margin:14px auto;padding:12px;background:var(--deep);border:1px solid var(--acc);border-radius:12px;max-width:460px"></div>
    <p class="small">Show this screen to your teacher. – Zeig diesen Bildschirm deiner Lehrkraft.</p>
    <p class="row" style="justify-content:center"><button class="btn primary" onclick="resetGame()">New player / play again</button>
      <button class="btn" onclick="location.href='./'">← All exercises</button></p></div>`;
  if(window.E8) E8.reportInto("coinbox", GAME_ID, S, save);
}
function resumeScreen(){
  hud();
  $("app").innerHTML = `<div class="panel"><span class="tag">Blackout at Hollow Lane</span><h2>Welcome back!</h2>
    <p>Someone has already started this case on this iPad. – Auf diesem iPad hat schon jemand angefangen.</p>
    <div class="row"><button class="btn primary" onclick="render()">Continue as ${esc(S.name)}</button>
      <button class="btn" onclick="resetGame()">I'm a new player</button></div></div>`;
}

load();
if(S.name && me() && S.nr!==me()){ S=fresh(); save(); }
if(S.name && !S.done && S.st>=0) resumeScreen(); else render();
</script>
</body>
</html>
