<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Hurricane Warning · The Hirsch Games</title>
<link rel="icon" href="logo.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{--bg:radial-gradient(ellipse at 50% 0%,#23345a 0%,#070b16 70%);--panel:#0e1526;--txt:#eef4ff;--muted:#a8b8d8;--line:#28385a;--btn:#141f36;--accent:#ffd23a;--accentTxt:#2a2000;--accent2:#8ad0ff;--bubble:#18243e;--input:#070b14;--ok:#7ef0a0;--bad:#ff8a7a}
  .track{position:relative;height:150px;overflow:hidden;background:linear-gradient(#4a5a78 0%,#8a9ab8 50%,#2a6a8a 50%,#14405a 100%)}
  .track .goal{position:absolute;right:14px;top:30px;font-size:54px}
  .track .start{position:absolute;left:12px;bottom:10px;font-size:34px}
  .track .path{position:absolute;left:40px;right:80px;bottom:34px;border-top:3px dashed rgba(255,255,255,.45)}
  .track .me{position:absolute;bottom:22px;width:56px;height:56px;border-radius:50%;overflow:hidden;border:3px solid var(--accent);background:#fff;transition:left .8s;box-shadow:0 4px 14px #0007}
  .track .me svg{width:100%;height:100%}
  .track .deco{position:absolute;font-size:26px;opacity:.9}
  .hud{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;font-size:14px;color:var(--accent2);background:rgba(0,0,0,.35);border-top:1px solid var(--line)}
  .hud b{color:var(--accent)}
  .card3{display:inline-block;vertical-align:top;background:var(--bubble);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:4px;min-width:170px;font-size:15px}
  .card3 b{font-size:17px}

</style>
</head>
<body>
<main id="app"></main>
<script src="game.js?v=11"></script>
<script src="juego.js?v=1"></script>
<script>
const SCENE = (S, o) => { const p = S.done ? 1 : S.solved / S.total;
  return `<div class="track">${(o.deco||[]).map(d => `<span class="deco" style="left:${d[0]}%;top:${d[1]}px">${d[2]}</span>`).join("")}<span class="start">${o.start}</span><span class="goal">${o.goal}</span><div class="path"></div>
    <div class="me" style="left:calc(40px + (100% - 180px) * ${p.toFixed(3)})">${E8.myAvatar()}</div></div>
    <div class="hud"><span>${o.label}</span><span><b>${Math.round(p * 100)} %</b> ${o.unit || ""}</span></div>`; };
const MA = {face:"🧔🏿‍♂️", name:"Marlon (Island FM)"}, CA = {face:"📞", name:"Caller"};
JUEGO.start({
  id: "ifclauses", key: "e9-hurricane", icon: "🌀", topic: "if-clauses", title: "Hurricane Warning",
  intro: `<p>🌀 <b>Hurricane Hector</b> is coming towards the little Caribbean island of St Lucia! In two days it could hit the island.</p>
    <p>You help <b>Marlon</b> at the radio station <b>Island FM</b>. People call in with questions, and you give them advice: <i>What will happen if …? What should we do if …?</i> Every right answer helps the island to get ready! 📻</p>
    <p class="de">Ein Hurrikan kommt. Du gibst im Radio Ratschläge mit if-Sätzen: If + present, … will … – und am Ende: If + past, … would …</p>`,
  goLabel: "📻 On air!", time: "about 20 minutes",
  rulesLabel: "The rules",
  rules: `<h2>if-clauses</h2>
    <div class="rule"><b>Type 1</b> (real, possible): <b>If + simple present, … will + verb</b><br><span class="ex">If the wind <b>gets</b> stronger, the schools <b>will close</b>.</span><br>⚠️ no will in the if-part! The if-part can come first (with comma) or second (no comma): <span class="ex">The schools will close if the wind gets stronger.</span></div>
    <div class="rule"><b>Type 2</b> (unreal, imagined): <b>If + simple past, … would + verb</b><br><span class="ex">If I <b>had</b> a boat, I <b>would sail</b> to Trinidad.</span> · <span class="ex">If I <b>were</b> you, I <b>would stay</b> at home.</span></div>`,
  stages: [
    { label: "Hour 1", title: "The first warning", go: "📻 Listen to the news",
      memo: `📻 “<b>If</b> Hurricane Hector <b>comes</b> closer, the airport <b>will close</b>. <b>If</b> the wind <b>is</b> too strong, there <b>will be</b> no electricity. The schools <b>will stay</b> closed <b>if</b> the storm <b>hits</b> the island.”`,
      intro: `<div class="who"><div class="face">🧔🏿‍♂️</div><div><b class="n">Marlon</b>Good morning, St Lucia! Here's the news from the weather office:</div></div>
        <div class="rule">📻 “<b>If</b> Hurricane Hector <b>comes</b> closer, the airport <b>will close</b>. <b>If</b> the wind <b>is</b> too strong, there <b>will be</b> no electricity. The schools <b>will stay</b> closed <b>if</b> the storm <b>hits</b> the island.”</div>
        <p class="de">Schau dir die Sätze an: Welche Zeitform steht nach if? Welche im anderen Satzteil?</p>`,
      pista: "Look at the news: after if → comes, is, hits. In the other part → will close, will be, will stay.",
      tasks: [
        { t: "choice", q: "Which tense comes after <b>if</b>?", keep: true, opts: ["simple present (comes, is)", "will-future (will come)", "simple past (came)"], a: "simple present (comes, is)", hint: "If Hector comes … · If the wind is … → simple present." },
        { t: "choice", q: "What is in the other part of the sentence?", keep: true, opts: ["will + verb", "simple present", "-ing form"], a: "will + verb", hint: "… the airport will close." },
        { t: "choice", who: MA, q: "If the storm ___ the island, the schools will close.", opts: ["hits", "will hit"], keep: true, a: "hits", hint: "No will after if → hits.", why: {"will hit": "⚠️ After if no will!"} },
        { t: "choice", who: MA, q: "If the wind is too strong, there ___ no electricity.", opts: ["will be", "is being"], keep: true, a: "will be", hint: "Main clause → will + verb." },
        { t: "choice", q: "Where do you need a comma?", keep: true, opts: ["If the airport closes, tourists will stay.", "Tourists will stay, if the airport closes."], a: "If the airport closes, tourists will stay.", hint: "Comma only when the if-part comes first." }
      ] },
    { label: "Hour 2", title: "Callers on the line", shuffle: true,
      memo: `📌 If + simple present (he/she/it <b>-s</b>!) … will + verb`,
      intro: `<div class="who"><div class="face">🧔🏿‍♂️</div><div><b class="n">Marlon</b>The phones are ringing! Help me answer our listeners.</div></div>`,
      tasks: [
        { t: "choice", who: CA, q: "“What happens if the hurricane ___ our village?”", opts: ["reaches", "will reach", "reach"], a: "reaches", hint: "if + simple present, he/she/it → -s: reaches." },
        { t: "choice", who: MA, q: "If it reaches your village, the police ___ you to a safe place.", opts: ["will take", "takes", "took"], a: "will take", hint: "Main clause → will + verb." },
        { t: "choice", who: CA, q: "“If we ___ at home, will we be safe?”", opts: ["stay", "will stay", "stays"], a: "stay", hint: "we → stay (no will after if)." },
        { t: "choice", who: MA, q: "You ___ safe if you stay away from the windows.", opts: ["will be", "are being", "would"], a: "will be", hint: "Main clause → will be." },
        { t: "choice", who: CA, q: "“My cat ___ scared if there's thunder!”", opts: ["will be", "is going", "be"], a: "will be", hint: "Main clause → will be." }
      ] },
    { label: "Hour 3", title: "Safety tips", shuffle: true,
      memo: `📌 If you <b>need</b> help, … you <b>will find</b> … · he/she/it: if the wind <b>gets</b> …`,
      intro: `<div class="who"><div class="face">🧔🏿‍♂️</div><div><b class="n">Marlon</b>Let's write our safety tips for the Island FM website. Use the verbs in brackets.</div></div>`,
      pista: "if-part → simple present (he/she/it -s). Other part → will + verb.",
      tasks: [
        { t: "type", who: MA, q: "If the electricity ___ off, use a torch – not candles. (go)", a: "goes", tips: { "will go": "No will after if → goes.", "go": "the electricity = it → goes." } },
        { t: "type", who: MA, q: "If you buy water now, you ___ enough for three days. (have)", a: ["will have", "'ll have"], tips: { "have": "Main clause → will have." } },
        { t: "type", who: MA, q: "If the wind ___ stronger, close all the windows. (get)", a: "gets", tips: { "will get": "No will after if → gets." } },
        { t: "type", who: MA, q: "The roads ___ dangerous if it rains a lot. (be)", a: ["will be", "'ll be"], tips: { "are": "Main clause → will be." } },
        { t: "type", who: MA, q: "If your family ___ help, call 911. (need)", a: "needs", tips: { "need": "your family = it → needs." } }
      ] },
    { label: "Hour 4", title: "The Island FM app", shuffle: true,
      memo: `📌 If + simple present, … will … · … will … if + simple present (no comma)`,
      intro: `<p>Island FM sends push messages to everybody's phone. Put the words in the right order – quickly!</p>`,
      tasks: [
        { t: "order", who: MA, task: "Push message:", taskDe: "Wenn der Sturm kommt, wird der Strom ausfallen.", words: ["If", "the", "storm", "comes,", "the", "electricity", "will", "go", "off."], a: "If the storm comes, the electricity will go off." },
        { t: "order", who: MA, task: "Push message:", taskDe: "Ihr werdet sicher sein, wenn ihr drinnen bleibt.", words: ["You", "will", "be", "safe", "if", "you", "stay", "inside."], a: "You will be safe if you stay inside." },
        { t: "order", who: MA, task: "Push message:", taskDe: "Wenn ihr Hilfe braucht, ruft Island FM an.", words: ["If", "you", "need", "help,", "call", "Island", "FM."], a: "If you need help, call Island FM." }
      ] },
    { label: "Hour 5", title: "Fake news!", shuffle: true,
      memo: `📌 ⚠️ no will after if · he/she/it -s · main clause: will + verb`,
      intro: `<div class="who"><div class="face">🧔🏿‍♂️</div><div><b class="n">Marlon</b>Somebody is sending strange messages on social media. They're wrong – in more than one way! Correct the grammar.</div></div>`,
      tasks: [
        { t: "error", task: "Tap the wrong word.", taskDe: "Tippe auf das falsche Wort.", words: ["If", "the", "hurricane", "will", "come,", "the", "sea", "will", "rise."], bad: 3, opts: ["–", "will", "would"], fix: "–", show: "If the hurricane comes, the sea will rise.", hint: "No will after if: If the hurricane comes, …" },
        { t: "error", task: "Tap the wrong word.", taskDe: "Tippe auf das falsche Wort.", words: ["If", "it", "rain", "all", "night,", "the", "river", "will", "flood."], bad: 2, opts: ["rains", "rain", "will rain"], fix: "rains", hint: "it → rains." },
        { t: "error", task: "Tap the wrong word.", taskDe: "Tippe auf das falsche Wort.", words: ["If", "you", "go", "outside,", "you", "are", "get", "wet."], bad: 5, opts: ["will", "are", "would"], fix: "will", hint: "Main clause → will get." }
      ] },
    { label: "Final", title: "What would you do?", go: "🌀 The last hour!",
      memo: `📌 <b>Type 2</b> (imagined): <b>If</b> + simple past, … <b>would</b> + verb · If I <b>were</b> you, I <b>would</b> …`,
      intro: `<div class="who"><div class="face">🧔🏿‍♂️</div><div><b class="n">Marlon</b>Big news! Hector has changed direction – it's going out to sea! 🎉 Our island is safe. Let's end the show with a fun question: What <b>would</b> you do if you <b>were</b> a hurricane hunter?</div></div>
        <div class="rule">“If I <b>were</b> a hurricane hunter, I <b>would fly</b> into the eye of the storm!” – <span class="de">(nur vorgestellt → If + simple past, … would …)</span></div>`,
      tasks: [
        { t: "choice", who: CA, q: "“If I ___ a plane, I would fly over the storm.”", opts: ["had", "have", "would have"], keep: true, a: "had", hint: "Type 2: If + simple past → had." },
        { t: "choice", who: CA, q: "“If I were you, I ___ a hurricane hunter!”", opts: ["would become", "will become", "became"], keep: true, a: "would become", hint: "Type 2: … would + verb." },
        { t: "type", who: MA, q: "If I were a hurricane, I ___ to the Arctic to cool down! (go)", a: ["would go", "'d go"], tips: { "will go": "Imagined (type 2) → would go." } },
        { t: "order", who: {av: true, name: "You"}, task: "Your last words on air:", taskDe: "Wenn ein neuer Sturm kommt, werden wir bereit sein!", words: ["If", "a", "new", "storm", "comes,", "we", "will", "be", "ready!"], a: "If a new storm comes, we will be ready!" }
      ] }
  ],
  scene: (S) => SCENE(S, { start: "📻", goal: S.done ? "☀️" : "🌀", label: "📻 Island FM · Hurricane Hector", unit: "ready", deco: [[24, 14, "🌴"], [46, 4, S.stage >= 5 ? "🌈" : "🌧️"], [64, 18, "🏝️"]] }),
  outro: `<div style="font-size:56px">☀️🏝️</div><h1>St Lucia is safe!</h1><p style="font-size:19px">Hurricane Hector has gone out to sea. Thanks to your tips, everybody was ready. Marlon says: “If you ever need a job, you'll always find one at Island FM!” 📻</p>`
});

</script>
</body>
</html>
